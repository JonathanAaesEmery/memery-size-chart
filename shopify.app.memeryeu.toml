# memeryeu.myshopify.com — custom app config
# Fill in CLIENT_ID and the Railway URL after you create the Partner app + Railway service.
# Deploy with: shopify app deploy --config memeryeu

client_id = "03bc8b2d037014b30ba569d01d92363c"
name = "memery-size-chart-eu"
application_url = "https://memery-size-chart-production-008a.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [
  "https://memery-size-chart-production-008a.up.railway.app/api/auth",
  "https://memery-size-chart-production-008a.up.railway.app/auth/callback"
]
